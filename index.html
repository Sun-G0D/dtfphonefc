    var seen = {}; seen[START] = true;
    var queue = [START];
    while (queue.length) {
      var id = queue.shift();
      bfsOrder.push(id);
      optionsOf(id).forEach(function (o) {
        if (NODES[o.to] && !seen[o.to]) { seen[o.to] = true; bfsParent[o.to] = { from: id, label: o.label }; queue.push(o.to); }
      });
    }
  })();
  var REACHABLE = {}; bfsOrder.forEach(function (id) { REACHABLE[id] = true; });

  function shortestPath(id) {
    if (!NODES[id]) return [{ id: START, via: null }];
    var chain = [];
    var cur = id;
    while (cur !== START && bfsParent[cur]) { chain.unshift({ id: cur, via: bfsParent[cur].label }); cur = bfsParent[cur].from; }
    if (cur !== START) return [{ id: id, via: null }];
    chain.unshift({ id: START, via: null });
    return chain;
  }

  /* ---------- Text formatting ---------- */
  var NOTE_RE = /\[(TBD|CONFIRM):\s*([^\]]*)\]/g;
  var TRAIL_NOTE_RE = /\s*\[(TBD|CONFIRM):\s*([^\]]*)\]\s*$/;

  // Pull [TBD]/[CONFIRM] notes off the END of a text so they can show as a badge row under it.
  function splitTrailingNotes(text) {
    var main = String(text == null ? '' : text);
    var notes = [];
    var m;
    while ((m = main.match(TRAIL_NOTE_RE))) { notes.unshift({ kind: m[1], note: m[2].trim() }); main = main.slice(0, m.index); }
    return { main: main.trim(), notes: notes };
  }
  function fmt(text) {
    var h = esc(text);
    h = h.replace(NOTE_RE, function (_, kind, note) {
      return '<span class="needs"><span class="needs-tag">Needs info</span>' + kind + ': ' + note.trim() + '</span>';
    });
    h = h.replace(/\[([^\]]+)\]/g, '<span class="ph">[$1]</span>');
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return h;
  }
  function plain(text) { return String(text == null ? '' : text).replace(/\*\*/g, ''); }
  function notesHtml(notes) {
    return notes.map(function (n) {
      return '<div class="needs-block"><span class="needs-tag">Needs info</span><span>' + esc(n.kind) + ': ' + fmt(n.note) + '</span></div>';
    }).join('');
  }
  function noteCount(id) {
    var n = NODES[id]; var c = 0;
    var all = [n.title].concat(itemsOf(id).map(function (it) { return (it.text || '') + ' ' + (it.why || ''); }))
      .concat(optionsOf(id).map(function (o) { return (o.label || '') + ' ' + (o.hint || ''); })).join(' ');
    all.replace(NOTE_RE, function () { c++; return ''; });
    return c;
  }
  function typeOf(item) { return item && TYPES[item.type] ? item.type : 'info'; }
  function primaryType(id) { var it = itemsOf(id)[0]; return typeOf(it); }
  function tico(type) { return '<span class="tico t-' + type + '" aria-hidden="true">' + TYPES[type].icon + '</span>'; }

  /* ---------- "Why?" state & training mode ---------- */
  var ALL_WHY = [];
  IDS.forEach(function (id) { itemsOf(id).forEach(function (it, i) { if (it && it.why) ALL_WHY.push(id + '#' + i); }); });
  var training = store('dtf-guide-training') === '1';
  var openWhys = new Set(training ? ALL_WHY : []);

  function whyBits(id, i, item) {
    if (!item.why) return null;
    var key = id + '#' + i;
    var safe = String(id).replace(/[^A-Za-z0-9_-]/g, '_') + '-' + i;
    var parts = splitTrailingNotes(item.why);
    var open = openWhys.has(key);
    return {
      notes: parts.notes,
      button: '<button type="button" class="why-btn" id="whyb-' + safe + '" data-why="' + esc(key) + '" aria-expanded="' + open + '" aria-controls="why-' + safe + '">' +
        '<span class="why-pill">Why?' + ICON.chev + '</span></button>',
      panel: '<div class="why-panel' + (open ? ' open' : '') + '" id="why-' + safe + '">' +
        '<div class="why-inner"><div class="why-box"><b>Why:</b> ' + fmt(parts.main) + '</div></div></div>'
    };
  }

  /* ---------- Rendering a step ---------- */
  function renderItems(id) {
    var groups = [];
    itemsOf(id).forEach(function (it, i) {
      var t = typeOf(it);
      var g = last(groups);
      if ((t === 'info' || t === 'do') && g && g.type === t) g.list.push({ it: it, i: i });
      else groups.push({ type: t, list: [{ it: it, i: i }] });
    });
    return groups.map(function (g) {
      if (g.type === 'info' || g.type === 'do') return renderList(id, g);
      return g.list.map(function (x) { return renderSingle(id, g.type, x.it, x.i); }).join('');
    }).join('');
  }
  function renderSingle(id, type, it, i) {
    var parts = splitTrailingNotes(it.text);
    var w = whyBits(id, i, it);
    var notes = parts.notes.concat(w ? w.notes : []);
    var label = type === 'say' && it.exact ? 'Say word for word' : TYPES[type].label;
    var head = '<div class="blk-head"><span class="tlabel t-' + type + '">' + tico(type) + label + '</span>' + (w ? w.button : '') + '</div>';
    var body = '';
    if (parts.main) {
      if (type === 'say') body = '<div class="bubble">' + fmt(parts.main) + '</div>';
      else if (type === 'ask') body = '<div class="q">' + fmt(parts.main) + '</div>';
      else body = '<div class="r">' + fmt(parts.main) + '</div>';
    }
    return '<div class="blk blk-' + type + '">' + head + body + notesHtml(notes) + (w ? w.panel : '') + '</div>';
  }
  function renderList(id, g) {
    var type = g.type;
    var lis = g.list.map(function (x) {
      var parts = splitTrailingNotes(x.it.text);
      var w = whyBits(id, x.i, x.it);
      var notes = parts.notes.concat(w ? w.notes : []);
      return '<li><div class="li-row"><span class="li-text">' + fmt(parts.main) + '</span>' + (w ? w.button : '') + '</div>' +
        notesHtml(notes) + (w ? w.panel : '') + '</li>';
    }).join('');
    return '<div class="blk blk-' + type + '"><div class="blk-head"><span class="tlabel t-' + type + '">' + tico(type) + TYPES[type].label + '</span></div>' +
      '<ul class="list ' + (type === 'do' ? 'checks' : 'bullets') + '">' + lis + '</ul></div>';
  }
  function isGrid(id) { return id === TOPICS_ID || optionsOf(id).length >= 5; }

  function currentCard(id, index, enter) {
    var n = NODES[id];
    var grid = isGrid(id);
    var opts = optionsOf(id).map(function (o, i) {
      var k = i < 9 ? String(i + 1) : (i === 9 ? '0' : '');
      var soon = NODES[o.to] && NODES[o.to].todo ? '<span class="soon">Coming soon</span>' : '';
      return '<button type="button" class="opt" data-opt="' + i + '"' + (k ? ' aria-keyshortcuts="' + k + '"' : '') + '>' +
        '<span class="num" aria-hidden="true">' + (k || '•') + '</span>' +
        '<span class="opt-text"><span class="opt-label">' + fmt(o.label) + '</span>' +
        (o.hint ? '<span class="opt-hint">' + fmt(o.hint) + '</span>' : '') + soon + '</span>' +
        '<span class="arr">' + ICON.arrow + '</span></button>';
    }).join('');
    var optLabel = id === TOPICS_ID ? 'Pick the topic' : (grid ? 'Pick one' : 'Next');
    return '<section class="card-current' + (enter ? ' enter' : '') + '" id="current-card" aria-labelledby="cur-title">' +
      '<div class="card-head"><span class="step-no" aria-hidden="true">' + (index + 1) + '</span>' +
      '<h2 id="cur-title" tabindex="-1"><span class="sr-only">Step ' + (index + 1) + ': </span>' + (grid ? ICON.fork : '') + '<span>' + fmt(n.title) + '</span></h2>' +
      (n.todo ? '<span class="soon">Coming soon</span>' : '') + '</div>' +
      '<div class="items">' + renderItems(id) + '</div>' +
      '<div class="opts-wrap"><p class="opts-label" id="opts-label">' + optLabel + '</p>' +
      (grid ? '<div class="fork" aria-hidden="true"></div>' : '') +
      '<div class="opts' + (grid ? ' grid' : '') + '" role="group" aria-labelledby="opts-label">' + opts + '</div></div>' +
      '</section>';
  }
  function pastCard(id, index) {
    return '<button type="button" class="card-past" data-rewind="' + index + '">' +
      '<span class="step-no" aria-hidden="true">' + (index + 1) + '</span>' +
      '<span class="t"><span class="sr-only">Go back to step ' + (index + 1) + ': </span>' + fmt(NODES[id].title) + '</span>' +
      '<span class="rw" aria-hidden="true">' + ICON.back + '</span></button>';
  }
  function connector(via, active) {
    return '<div class="conn' + (active ? ' active' : '') + '"><span class="conn-label"><span class="sr-only">Chose: </span>' +
      (via ? fmt(via) : '↓') + '</span></div>';
  }

  /* ---------- State, history and deep links ---------- */
  var path = [];
  var btnBack = $('#btn-back'), btnRestart = $('#btn-restart'), btnTopics = $('#btn-topics');
  var btnMap = $('#btn-map'), btnSearch = $('#btn-search'), btnMenu = $('#btn-menu');
  var srStatus = $('#sr-status');

  function currentId() { return last(path).id; }
  function keyOf(p) { return (p || []).map(function (s) { return s.id; }).join('>'); }
  function validPath(p) { return Array.isArray(p) && p.length > 0 && p.every(function (s) { return s && NODES[s.id]; }); }
  function hashId() { try { return decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) { return location.hash.replace(/^#/, ''); } }

  function writeHistory(state, replace) {
    var url = '#' + encodeURIComponent(last(state.path).id);
    try {
      if (replace) history.replaceState(state, '', url); else history.pushState(state, '', url);
    } catch (e) {
      if (location.hash !== url) location.hash = url;   // fallback for browsers that block pushState here
    }
  }
  function go(newPath, opts) {
    opts = opts || {};
    var prev = path;
    if (keyOf(newPath) === keyOf(prev)) {          // already here: just bring it into view
      scrollToCurrent(true);
      var ttl = $('#cur-title'); if (ttl && opts.focus !== false) ttl.focus({ preventScroll: true });
      return;
    }
    var enter = newPath.length === prev.length + 1 && keyOf(newPath.slice(0, -1)) === keyOf(prev);
    path = newPath;
    writeHistory({ path: path, prev: keyOf(prev) }, !!opts.replace);
    render({ enter: enter, focus: opts.focus !== false, smooth: true });
  }
  function choose(i) {
    var o = optionsOf(currentId())[i];
    if (!o || !NODES[o.to]) return;
    if (o.to === START) go([{ id: START, via: null }]);        // "Start a new call" clears the path
    else go(path.concat([{ id: o.to, via: o.label }]));
  }
  function rewind(i) { if (i >= 0 && i < path.length - 1) go(path.slice(0, i + 1)); }
  function jumpTo(id) { if (NODES[id]) go(shortestPath(id)); }
  function goBack() {
    if (path.length < 2) return;
    var target = path.slice(0, -1);
    var st = history.state;
    if (st && st.prev === keyOf(target) && keyOf(st.path) === keyOf(path)) history.back();
    else go(target);
  }
  function fromHash() {
    var id = hashId();
    if (id && NODES[id]) path = shortestPath(id);
    else {
      if (id) toast('Couldn’t find the step “' + id + '”. Starting from the beginning.');
      path = [{ id: START, via: null }];
    }
    writeHistory({ path: path, prev: null }, true);
    render({ focus: true, smooth: true });
  }
  window.addEventListener('popstate', function (e) {
    var st = e.state;
    if (st && validPath(st.path)) { path = st.path; render({ focus: true, smooth: true }); }
    else if (!(path.length && hashId() === currentId())) fromHash();
  });
  window.addEventListener('hashchange', function () {
    var id = hashId();
    if (path.length && id === currentId()) return;
    fromHash();
  });

  /* ---------- Render ---------- */
  function render(o) {
    o = o || {};
    var lastI = path.length - 1;
    var html = '';
    path.forEach(function (s, i) {
      if (i > 0) html += connector(s.via, i === lastI);
      html += i === lastI ? currentCard(s.id, i, o.enter) : pastCard(s.id, i);
    });
    flow.innerHTML = html;

    var id = currentId();
    btnBack.disabled = path.length < 2;
    if (id === TOPICS_ID) btnTopics.setAttribute('aria-current', 'true'); else btnTopics.removeAttribute('aria-current');
    document.title = NODES[id].title + ' — ' + APP_TITLE;
    srStatus.textContent = 'Step ' + path.length + ': ' + NODES[id].title;
    updateMap(true);

    var title = $('#cur-title');
    if (o.focus && title) title.focus({ preventScroll: true });
    if (o.scroll !== false) scrollToCurrent(o.smooth);
  }
  function scrollToCurrent(smooth) {
    var behavior = smooth && !reduceMotion.matches ? 'smooth' : 'auto';
    if (path.length === 1) { window.scrollTo({ top: 0, behavior: behavior }); return; }
    var card = $('#current-card');
    if (!card) return;
    var target = card.previousElementSibling && card.previousElementSibling.classList.contains('conn') ? card.previousElementSibling : card;
    target.scrollIntoView({ behavior: behavior, block: 'start' });
  }

  flow.addEventListener('click', function (e) {
    var why = e.target.closest('.why-btn');
    if (why) { toggleWhy(why); return; }
    var opt = e.target.closest('.opt');
    if (opt) { choose(+opt.getAttribute('data-opt')); return; }
    var past = e.target.closest('.card-past');
    if (past) { rewind(+past.getAttribute('data-rewind')); }
  });
  function toggleWhy(btn) {
    var open = btn.getAttribute('aria-expanded') !== 'true';
    var panel = document.getElementById(btn.getAttribute('aria-controls'));
    btn.setAttribute('aria-expanded', String(open));
    if (panel) panel.classList.toggle('open', open);
    var key = btn.getAttribute('data-why');
    if (open) openWhys.add(key); else openWhys.delete(key);
  }

  /* ---------- Map: outline of the whole tree ---------- */
  var mapRoot = document.createElement('div');
  mapRoot.className = 'map';
  var mapSide = $('#map-side'), mapSheetBody = $('#map-sheet-body'), layout = $('#layout');
  var dlgMap = $('#dlg-map'), dlgSearch = $('#dlg-search'), dlgMenu = $('#dlg-menu');
  var expanded = new Set();
  var expanderOf = {};      // id -> id of the outline row that must be open to show it
  var hasKids = {};
  var sideHidden = store('dtf-guide-map-hidden') === '1';

  function buildMap() {
    // A step that 3+ different steps lead to (like "Anything else?") is a shared step:
    // it's listed once at the top level instead of under one topic.
    var parentsOf = {};
    bfsOrder.forEach(function (id) {
      optionsOf(id).forEach(function (o) {
        if (!REACHABLE[o.to]) return;
        (parentsOf[o.to] = parentsOf[o.to] || {})[id] = true;
      });
    });
    var parentCount = function (id) { return Object.keys(parentsOf[id] || {}).length; };
    var shared = {};
    bfsOrder.forEach(function (id) { if (id !== START && parentCount(id) >= 3) shared[id] = true; });

    var kidsOf = {};
    bfsOrder.forEach(function (id) {
      var seen = {}; var kids = [];
      optionsOf(id).forEach(function (o) {
        if (!NODES[o.to] || seen[o.to]) return;
        seen[o.to] = true;
        var isTree = o.to !== START && !shared[o.to] && bfsParent[o.to] && bfsParent[o.to].from === id;
        if (isTree) kids.push({ kind: 'node', id: o.to });
        else if (!shared[o.to]) kids.push({ kind: 'ref', id: o.to });
      });
      kidsOf[id] = kids;
    });

    function badges(id) {
      var b = '';
      var c = noteCount(id);
      if (NODES[id].todo) b += '<span class="tn-badge soon-b">Soon</span>';
      if (c) b += '<span class="tn-badge needs-b">Needs info' + (c > 1 ? ' \u00D7' + c : '') + '</span>';
      return b ? '<span class="tn-badges">' + b + '</span>' : '';
    }
    function nodeLi(id, nested, extraClass) {
      var n = NODES[id];
      var sub = shared[id] ? '<span class="tn-sub">Shared step · reached from ' + parentCount(id) + ' steps</span>' : '';
      var toggle = nested
        ? '<button type="button" class="tn-toggle" data-toggle="' + esc(id) + '" aria-expanded="false" aria-controls="mk-' + esc(id) + '">' +
          '<span class="sr-only">Show or hide steps under ' + esc(plain(n.title)) + '</span>' + ICON.chev + '</button>'
        : '<span class="tn-spacer" aria-hidden="true"></span>';
      return '<li class="tn' + (extraClass ? ' ' + extraClass : '') + '" data-node="' + esc(id) + '"><div class="tn-row">' + toggle +
        '<button type="button" class="tn-jump" data-jump="' + esc(id) + '">' + tico(primaryType(id)) +
        '<span class="tn-text"><span class="tn-title">' + esc(plain(n.title)) + '</span>' + sub + badges(id) + '</span></button></div>' +
        (nested || '') + '</li>';
    }
    function refLi(id) {
      return '<li class="tn tn-ref"><div class="tn-row"><span class="tn-spacer" aria-hidden="true"></span>' +
        '<button type="button" class="tn-jump" data-jump="' + esc(id) + '"><span class="ref-arrow" aria-hidden="true">↪</span>' +
        '<span class="tn-text"><span class="sr-only">Leads to: </span><span class="tn-title">' + esc(plain(NODES[id].title)) + '</span></span></button></div></li>';
    }
    function siblings(entries, expander, isRoot) {
      var h = '';
      entries.forEach(function (entry, idx) {
        if (entry.kind === 'ref') { h += refLi(entry.id); return; }
        var id = entry.id;
        var first = true;
        // Steps with a single next step are shown as a sequence at the same level.
        for (;;) {
          expanderOf[id] = expander;
          var kids = kidsOf[id] || [];
          var cls = isRoot && idx > 0 && first ? 'root-group' : '';
          if (optionsOf(id).length === 1 && kids.length === 1 && kids[0].kind === 'node') {
            h += nodeLi(id, null, cls);
            id = kids[0].id; first = false;
            continue;
          }
          var nested = kids.length ? '<ul class="tree" id="mk-' + esc(id) + '" hidden>' + siblings(kids, id, false) + '</ul>' : '';
          if (kids.length) hasKids[id] = true;
          h += nodeLi(id, nested, cls);
          break;
        }
      });
      return h;
    }
    var roots = [{ kind: 'node', id: START }].concat(bfsOrder.filter(function (id) { return shared[id]; }).map(function (id) { return { kind: 'node', id: id }; }));
    var legend = Object.keys(TYPES).map(function (t) { return '<span>' + tico(t) + TYPES[t].label + '</span>'; }).join('');
    mapRoot.innerHTML =
      '<div class="map-tools"><button type="button" class="mini-btn" data-map="expand">Expand all</button>' +
      '<button type="button" class="mini-btn" data-map="collapse">Collapse all</button></div>' +
      '<ul class="tree root">' + siblings(roots, null, true) + '</ul>' +
      '<div class="map-legend" aria-label="Icon key">' + legend + '</div>';

    // Open the top level by default.
    Object.keys(hasKids).forEach(function (id) { if (expanderOf[id] === null) setExpanded(id, true); });
  }
  function setExpanded(id, on) {
    if (on) expanded.add(id); else expanded.delete(id);
    var ul = mapRoot.querySelector('[id="mk-' + id + '"]');
    if (ul) ul.hidden = !on;
    var t = mapRoot.querySelector('[data-toggle="' + id + '"]');
    if (t) t.setAttribute('aria-expanded', String(on));
  }
  function mapScroller() { return wideMQ.matches ? mapSide : mapSheetBody; }
  function revealCurrentInMap() {
    var row = mapRoot.querySelector('.tn-jump[aria-current]');
    var box = mapScroller();
    if (!row || !box || !box.clientHeight) return;
    var r = row.getBoundingClientRect(), b = box.getBoundingClientRect();
    if (r.top < b.top + 8 || r.bottom > b.bottom - 8) box.scrollTop += r.top - b.top - b.height / 3;
  }
  function updateMap(scroll) {
    var id = currentId();
    $$('.tn-jump[aria-current]', mapRoot).forEach(function (b) { b.removeAttribute('aria-current'); });
    var row = mapRoot.querySelector('.tn[data-node="' + id + '"] > .tn-row > .tn-jump');
    if (row) row.setAttribute('aria-current', 'step');
    var e = expanderOf[id];
    while (e) { setExpanded(e, true); e = expanderOf[e]; }
    if (scroll) revealCurrentInMap();
  }
  mapRoot.addEventListener('click', function (e) {
    var t = e.target.closest('[data-toggle]');
    if (t) { var id = t.getAttribute('data-toggle'); setExpanded(id, !expanded.has(id)); return; }
    var tool = e.target.closest('[data-map]');
    if (tool) {
      var on = tool.getAttribute('data-map') === 'expand';
      Object.keys(hasKids).forEach(function (id) { setExpanded(id, on); });
      return;
    }
    var j = e.target.closest('[data-jump]');
    if (j) {
      var target = j.getAttribute('data-jump');
      if (dlgMap.open) closeForNav(dlgMap);
      jumpTo(target);
    }
  });
  function placeMap() {
    if (wideMQ.matches) { mapSide.appendChild(mapRoot); if (dlgMap.open) dlgMap.close(); }
    else mapSheetBody.appendChild(mapRoot);
    updateLayout();
  }
  function updateLayout() {
    var showSide = wideMQ.matches && !sideHidden;
    layout.classList.toggle('has-side', showSide);
    mapSide.hidden = !showSide;
    if (wideMQ.matches) {
      btnMap.setAttribute('aria-pressed', String(showSide));
      btnMap.removeAttribute('aria-haspopup');
      btnMap.setAttribute('aria-label', showSide ? 'Map (hide sidebar)' : 'Map (show sidebar)');
    } else {
      btnMap.removeAttribute('aria-pressed');
      btnMap.setAttribute('aria-haspopup', 'dialog');
      btnMap.setAttribute('aria-label', 'Map');
    }
  }

  /* ---------- Search ---------- */
  function norm(s) {
    return plain(s).toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[\u2018\u2019'\u201C\u201D"]/g, '')
      .replace(/[^a-z0-9+$&]+/g, ' ').trim();
  }
  var INDEX = bfsOrder.concat(IDS.filter(function (id) { return !REACHABLE[id]; })).map(function (id, order) {
    var n = NODES[id];
    return {
      id: id, order: order,
      title: norm(n.title),
      kw: (n.keywords || []).map(norm),
      opts: norm(optionsOf(id).map(function (o) { return (o.label || '') + ' ' + (o.hint || ''); }).join(' ')),
      text: norm(itemsOf(id).map(function (it) { return (it.text || '') + ' ' + (it.why || ''); }).join(' '))
    };
  });
  function search(q) {
    var nq = norm(q);
    if (!nq) return [];
    var terms = nq.split(' ').filter(Boolean);
    var out = [];
    INDEX.forEach(function (e) {
      var score = 0;
      for (var i = 0; i < terms.length; i++) {
        var t = terms[i], s = 0;
        if (e.title.indexOf(t) > -1) s += 6;
        if (e.kw.some(function (k) { return k.indexOf(t) > -1; })) s += 4;
        if (e.opts.indexOf(t) > -1) s += 1;
        if (e.text.indexOf(t) > -1) s += 1;
        if (!s) return;                       // every word must match somewhere
        score += s;
      }
      if (terms.length > 1) {
        if (e.title.indexOf(nq) > -1) score += 8;
        if (e.kw.some(function (k) { return k.indexOf(nq) > -1; })) score += 10;
        if (e.text.indexOf(nq) > -1) score += 3;
      }
      if (e.kw.indexOf(nq) > -1) score += 6;
      out.push({ e: e, score: score, terms: terms });
    });
    out.sort(function (a, b) { return b.score - a.score || a.e.order - b.e.order; });
    return out;
  }
  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function highlight(text, terms) {
    var h = esc(text);
    terms.filter(function (t) { return t.length > 1; }).forEach(function (t) {
      h = h.replace(new RegExp('(' + escRe(esc(t)) + ')(?![^<]*>)', 'ig'), '<mark>$1</mark>');
    });
    return h;
  }
  function snippet(id, terms) {
    var texts = itemsOf(id).map(function (it) { return plain(it.text); })
      .concat(itemsOf(id).filter(function (it) { return it.why; }).map(function (it) { return plain(it.why); }));
    for (var i = 0; i < terms.length; i++) {
      var t = terms[i];
      if (t.length < 2) continue;
      for (var j = 0; j < texts.length; j++) {
        var idx = texts[j].toLowerCase().indexOf(t);
        if (idx > -1) {
          var s = texts[j];
          var start = Math.max(0, idx - 40);
          if (start > 0) { var sp = s.lastIndexOf(' ', start); start = sp > -1 ? sp + 1 : start; }
          var piece = s.slice(start, start + 120);
          return (start > 0 ? '…' : '') + highlight(piece, terms) + (start + 120 < s.length ? '…' : '');
        }
      }
    }
    var kw = (NODES[id].keywords || []).filter(function (k) { var nk = norm(k); return terms.some(function (t) { return nk.indexOf(t) > -1; }); }).slice(0, 3);
    if (kw.length) return 'Matches ' + kw.map(function (k) { return '“' + highlight(k, terms) + '”'; }).join(', ');
    var t0 = plain(itemsOf(id)[0] ? itemsOf(id)[0].text : '');
    return esc(t0.length > 110 ? t0.slice(0, 110) + '…' : t0);
  }
  function crumb(id) {
    var names = [];
    var e = expanderOf[id];
    while (e) { if (e !== TOPICS_ID) names.unshift(plain(NODES[e].title)); e = expanderOf[e]; }
    if (names.length) return names.join(' › ');
    if (expanderOf[id] === TOPICS_ID) return 'Topic';
    return 'Call steps';
  }
  function resultItem(id, terms) {
    return '<li><button type="button" class="res" data-jump="' + esc(id) + '">' + tico(primaryType(id)) +
      '<span class="res-main"><span class="res-title">' + (terms ? highlight(plain(NODES[id].title), terms) : esc(plain(NODES[id].title))) + '</span>' +
      '<span class="res-crumb">' + esc(crumb(id)) + '</span>' +
      (terms ? '<span class="res-snip">' + snippet(id, terms) + '</span>' : (optionsHint(id))) + '</span></button></li>';
  }
  function optionsHint(id) {
    var o = bfsParent[id] && optionsOf(bfsParent[id].from).filter(function (x) { return x.to === id; })[0];
    return o && o.hint ? '<span class="res-snip">' + fmt(o.hint) + '</span>' : '';
  }
  var searchInput = $('#search-input'), searchResults = $('#search-results'), searchCount = $('#search-count');
  function runSearch() {
    var q = searchInput.value;
    if (!norm(q)) {
      var topics = NODES[TOPICS_ID] ? optionsOf(TOPICS_ID).map(function (o) { return o.to; }).filter(function (id) { return NODES[id]; }) : [];
      searchCount.textContent = topics.length ? 'All topics' : '';
      searchResults.innerHTML = topics.map(function (id) { return resultItem(id, null); }).join('');
      return;
    }
    var res = search(q);
    searchCount.textContent = res.length ? res.length + (res.length === 1 ? ' result' : ' results') : 'No results. Try another word, or browse the Map.';
    searchResults.innerHTML = res.slice(0, 40).map(function (r) { return resultItem(r.e.id, r.terms); }).join('');
  }
  searchInput.addEventListener('input', runSearch);
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {               // close right away (search boxes would otherwise just clear)
      e.preventDefault();
      dlgSearch.close();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      var first = searchResults.querySelector('.res');
      if (first) first.click();
    } else if (e.key === 'ArrowDown') {
      var f = searchResults.querySelector('.res');
      if (f) { e.preventDefault(); f.focus(); }
    }
  });
  searchResults.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    var all = $$('.res', searchResults);
    var i = all.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    if (e.key === 'ArrowDown' && all[i + 1]) all[i + 1].focus();
    if (e.key === 'ArrowUp') (all[i - 1] || searchInput).focus();
  });
  searchResults.addEventListener('click', function (e) {
    var b = e.target.closest('[data-jump]');
    if (!b) return;
    closeForNav(dlgSearch);
    jumpTo(b.getAttribute('data-jump'));
  });

  /* ---------- Dialogs ---------- */
  var restoreFocus = null, skipRestore = false;
  function openDialog(d) {
    if (d.open) return;
    restoreFocus = document.activeElement;
    d.showModal();
  }
  function closeForNav(d) { skipRestore = true; d.close(); }
  [dlgMap, dlgSearch, dlgMenu].forEach(function (d) {
    d.addEventListener('close', function () {
      if (skipRestore) { skipRestore = false; return; }
      if (restoreFocus && document.contains(restoreFocus) && typeof restoreFocus.focus === 'function') restoreFocus.focus({ preventScroll: true });
    });
    d.addEventListener('click', function (e) {
      if (e.target.closest('[data-close]')) { d.close(); return; }
      if (e.target !== d) return;
      var r = d.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close();
    });
  });

  /* ---------- Top bar ---------- */
  btnBack.addEventListener('click', goBack);
  btnRestart.addEventListener('click', function () { go([{ id: START, via: null }]); });
  if (NODES[TOPICS_ID]) btnTopics.addEventListener('click', function () { jumpTo(TOPICS_ID); });
  else btnTopics.hidden = true;
  btnMap.addEventListener('click', function () {
    if (wideMQ.matches) {
      sideHidden = !sideHidden;
      store('dtf-guide-map-hidden', sideHidden ? '1' : '0');
      updateLayout();
      if (!sideHidden) revealCurrentInMap();
    } else {
      openDialog(dlgMap);
      revealCurrentInMap();
    }
  });
  function openSearch() {
    openDialog(dlgSearch);
    runSearch();
    searchInput.focus();
    searchInput.select();
  }
  btnSearch.addEventListener('click', openSearch);
  btnMenu.addEventListener('click', function () { openDialog(dlgMenu); });
  $('#skip').addEventListener('click', function () {
    scrollToCurrent(false);
    var t = $('#cur-title'); if (t) t.focus({ preventScroll: true });
  });

  /* ---------- Menu: training mode, copy/share link ---------- */
  var trainingSwitch = $('#training-switch'), trainingPill = $('#training-pill');
  function setTraining(on) {
    training = on;
    store('dtf-guide-training', on ? '1' : '0');
    openWhys = new Set(on ? ALL_WHY : []);
    $$('.why-btn', flow).forEach(function (b) {
      b.setAttribute('aria-expanded', String(on));
      var p = document.getElementById(b.getAttribute('aria-controls'));
      if (p) p.classList.toggle('open', on);
    });
    trainingSwitch.setAttribute('aria-checked', String(on));
    trainingPill.hidden = !on;
  }
  trainingSwitch.addEventListener('click', function () {
    setTraining(trainingSwitch.getAttribute('aria-checked') !== 'true');
    toast(training ? 'Training mode on: all explanations are open' : 'Training mode off');
  });
  $('#copy-link').addEventListener('click', function () {
    var url = location.href;
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = url; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      dlgMenu.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      toast(ok ? 'Link copied' : 'Copy this link: ' + url);
    };
    try {
      navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, fallback);
    } catch (e) { fallback(); }
  });
  var shareBtn = $('#share-link');
  if (navigator.share) {
    shareBtn.hidden = false;
    shareBtn.addEventListener('click', function () {
      navigator.share({ title: NODES[currentId()].title + ' — ' + APP_TITLE, url: location.href }).catch(function () {});
    });
  }

  var toastEl = $('#toast'), toastTimer = null;
  function toast(msg) {
    var openDlg = document.querySelector('dialog[open]');
    (openDlg || document.body).appendChild(toastEl);   // keep it visible above an open panel
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3200);
  }

  /* ---------- Keyboard ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    if (document.querySelector('dialog[open]')) return;
    var t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    if (/^[0-9]$/.test(e.key)) {
      var i = e.key === '0' ? 9 : +e.key - 1;
      if (optionsOf(currentId())[i]) { e.preventDefault(); choose(i); }
    } else if (e.key === '/') {
      e.preventDefault();
      openSearch();
    }
  });

  /* ---------- Header height (for sticky offsets) ---------- */
  var topbar = $('#topbar');
  function setHeaderH() { document.documentElement.style.setProperty('--header-h', topbar.offsetHeight + 'px'); }
  setHeaderH();
  if (window.ResizeObserver) new ResizeObserver(setHeaderH).observe(topbar);
  else window.addEventListener('resize', setHeaderH);

  /* ---------- Start ---------- */
  $('#brand').textContent = APP_TITLE;
  $('#last-updated').textContent = META.lastUpdated || '';
  $('#about-line').textContent = 'Content version ' + (META.version || '—') + ', last updated ' + (META.lastUpdated || '—') + '.';
  trainingSwitch.setAttribute('aria-checked', String(training));
  trainingPill.hidden = !training;

  buildMap();
  placeMap();
  onMQ(wideMQ, placeMap);

  (function init() {
    var h = hashId();
    var st = history.state;
    var prev = null;
    if (st && validPath(st.path) && last(st.path).id === (h || START)) { path = st.path; prev = st.prev || null; }
    else if (h && NODES[h]) path = shortestPath(h);
    else {
      if (h) setTimeout(function () { toast('Couldn’t find the step “' + h + '”. Starting from the beginning.'); }, 0);
      path = [{ id: START, via: null }];
    }
    writeHistory({ path: path, prev: prev }, true);
    render({ focus: false, smooth: false, scroll: path.length > 1 });
  })();
})();
</script>
</body>
</html>
